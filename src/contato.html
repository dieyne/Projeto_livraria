<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Livraria - Contato</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Cabeçalho -->
    <h1 style="color:#00f3ff; text-align: center;">Livraria John & Paul</h1>
    <h3 style="text-align: center;">Livros novos e usados com os melhores preços para você</h3>

    <!-- Menu Superior -->
    <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="produtos.html">Livros</a></li>
        <li><a href="#">Promoções</a></li>
        <li><a href="sobre.html">John & Paul</a></li>
        <li><a href="contato.html">Contate-nos</a></li>
    </ul>

    <!-- Formulário de Contato -->
    <h2>Contate-nos</h2>

    <form action="#" method="post">
        <p>
            <label for="nome">Nome:</label><br>
            <input type="text" id="nome" name="nome">
        </p>

        <p>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email">
        </p>

        <p>
            <label for="telefone">Telefone:</label><br>
            <input type="tel" id="telefone" name="telefone">
        </p>

        <p>
            <label for="assunto">Assunto:</label><br>
            <select id="assunto" name="assunto">
                <option value="">Selecione --</option>
                <option value="trocas">Trocas</option>
                <option value="atendimento">Atendimento</option>
                <option value="comercial">Comercial</option>
                <option value="outros">Outros</option>
            </select>
        </p>

        <p>
            <label for="mensagem">Mensagem:</label><br>
            <textarea id="mensagem" name="mensagem" rows="5" cols="40"></textarea>
        </p>

        <p>
            <input type="checkbox" id="newsletter" name="newsletter">
            <label for="newsletter">Desejo receber informações sobre a Livraria John e Paul</label>
        </p>

        <p>
            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>
        </p>
    </form>

    <!-- Menu do Rodapé -->
    <ul>

        <li><a href="contato.html">Contate-nos</a></li>
    </ul>

    <p>2014. Livraria John & Paul – Todos os direitos reservados</p>

</body>

</html>
